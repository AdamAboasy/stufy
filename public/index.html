<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study — Smart Study Planner</title>
  <meta name="description" content="Smart Study Planner — upload materials, build realistic study plans." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="loader" style="min-height:100vh"><div class="spinner"></div></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Safety net: if the app never boots (scripts failed to load) or any
    // uncaught error fires, show a clear message instead of an endless spinner.
    (function () {
      function showFatal(msg, hint) {
        var loader = document.querySelector(".loader");
        var target = loader || document.body;
        target.innerHTML =
          "<div class='auth'><main class='auth-main'><div class='auth-card' style='text-align:center'>" +
          "<div class='brand-logo' style='margin:0 auto 16px;background:linear-gradient(135deg,#4f7cff,#7b4fff);color:#fff'>" +
          "<svg width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>" +
          "<path d='M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'/><path d='M12 9v4M12 17h.01'/></svg></div>" +
          "<h1>Error</h1><p class='sub'>" + msg + "</p>" +
          (hint ? "<p class='hint' style='margin-top:10px'>" + hint + "</p>" : "") +
          "<button class='btn btn-primary' onclick='location.reload()' style='margin-top:12px'>Reload</button>" +
          "</div></main></div>";
      }
      window.addEventListener("error", function (e) {
        if (e && e.error && e.error.message) {
          showFatal(String(e.error.message), "An unexpected error occurred. Reload to try again.");
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        if (r && r.message) showFatal(String(r.message), "A request or operation failed. Reload to try again.");
      });
      setTimeout(function () {
        if (!window.__stufyReady) {
          var loader = document.querySelector(".loader");
          if (loader) showFatal("The app failed to load.", "Open this page through the running server, then reload.");
        }
      }, 6000);
    })();
  </script>
</body>
</html>
