  </text>
  
  <!-- Student Portal Badge -->
  <rect x="68" y="40" width="112" height="18" rx="9" fill="#1E293B" stroke="#00D2FF" stroke-width="1" />
  <circle cx="78" cy="49" r="3.5" fill="#00D2FF" />
  <text x="86" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#93C5FD" letter-spacing="0.5">
