<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="app-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="icon-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="icon-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#app-bg)" stroke="url(#app-border)" stroke-width="6" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="245" r="170" fill="#00D2FF" opacity="0.12" filter="url(#icon-glow)" />
  <circle cx="256" cy="245" r="130" fill="#7C3AED" opacity="0.1" filter="url(#icon-glow)" />

  <!-- Scaled Core Symbol Centered -->
  <g transform="translate(68, 68) scale(1.88)">
    <!-- Book Left Stack -->
    <path d="M100 148 C72 135 44 140 22 154 L22 96 C44 82 72 80 100 92 Z" fill="#030712" opacity="0.6" />
    <!-- Book Right Stack -->
    <path d="M100 148 C128 135 156 140 178 154 L178 96 C156 82 128 80 100 92 Z" fill="#030712" opacity="0.6" />

    <!-- Left Main Page -->
    <path d="M100 142 C70 128 42 134 24 146 L24 90 C42 78 70 74 100 86 Z" fill="url(#icon-blue-grad)" />
    <path d="M38 102 C55 94 76 92 92 98" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M38 114 C55 106 76 104 92 110" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M38 126 C55 118 76 116 92 122" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- Right Main Page -->
    <path d="M100 142 C130 128 158 134 176 146 L176 90 C158 78 130 74 100 86 Z" fill="url(#icon-purple-grad)" />
    <path d="M108 98 C124 92 145 94 162 102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M108 110 C124 104 145 106 162 114" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M108 122 C124 116 145 118 162 126" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- Spine -->
    <path d="M100 86 L100 156" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />

    <!-- Clock Orbit -->
    <circle cx="100" cy="74" r="46" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5" />

    <!-- Clock Ring -->
    <circle cx="100" cy="74" r="40" fill="#0A1128" stroke="url(#icon-blue-grad)" stroke-width="4.5" />
    <circle cx="100" cy="74" r="34" fill="#0B132B" />

    <!-- Clock Ticks -->
    <line x1="100" y1="42" x2="100" y2="47" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="132" y1="74" x2="127" y2="74" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="100" y1="106" x2="100" y2="101" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="74" x2="73" y2="74" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hands at 10:10 -->
    <line x1="100" y1="74" x2="84" y2="58" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="74" x2="122" y2="54" stroke="#C084FC" stroke-width="3" stroke-linecap="round" />
    <circle cx="100" cy="74" r="5" fill="#00D2FF" />
    <circle cx="100" cy="74" r="2" fill="#FFFFFF" />

    <!-- Top Spark -->
    <path d="M100 18 L102 24 L108 26 L102 28 L100 34 L98 28 L92 26 L98 24 Z" fill="#00D2FF" />
  </g>
</svg>
