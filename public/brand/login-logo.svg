<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="ll-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ll-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="ll-ambient" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A1128" stop-opacity="0" />
    </radialGradient>
    <filter id="ll-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="200" cy="115" r="110" fill="url(#ll-ambient)" />

  <!-- Symbol Centered at Top -->
  <g transform="translate(100, 20) scale(1)">
    <!-- Book Left Stack -->
    <path d="M100 148 C72 135 44 140 22 154 L22 96 C44 82 72 80 100 92 Z" fill="#030712" opacity="0.6" />
    <!-- Book Right Stack -->
    <path d="M100 148 C128 135 156 140 178 154 L178 96 C156 82 128 80 100 92 Z" fill="#030712" opacity="0.6" />

    <!-- Left Main Page -->
    <path d="M100 142 C70 128 42 134 24 146 L24 90 C42 78 70 74 100 86 Z" fill="url(#ll-blue)" />
    <path d="M38 102 C55 94 76 92 92 98" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M38 114 C55 106 76 104 92 110" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Right Main Page -->
    <path d="M100 142 C130 128 158 134 176 146 L176 90 C158 78 130 74 100 86 Z" fill="url(#ll-purple)" />
    <path d="M108 98 C124 92 145 94 162 102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M108 110 C124 104 145 106 162 114" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Spine -->
    <path d="M100 86 L100 156" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />

    <!-- Clock -->
    <circle cx="100" cy="74" r="40" fill="#0A1128" stroke="url(#ll-blue)" stroke-width="4.5" filter="url(#ll-glow)" />
    <circle cx="100" cy="74" r="34" fill="#0B132B" />
    <!-- Ticks -->
    <line x1="100" y1="42" x2="100" y2="47" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="132" y1="74" x2="127" y2="74" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Hands at 10:10 -->
    <line x1="100" y1="74" x2="84" y2="58" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="74" x2="122" y2="54" stroke="#C084FC" stroke-width="3" stroke-linecap="round" />
    <circle cx="100" cy="74" r="5" fill="#00D2FF" />
    <circle cx="100" cy="74" r="2" fill="#FFFFFF" />
    <path d="M100 18 L102 24 L108 26 L102 28 L100 34 L98 28 L92 26 L98 24 Z" fill="#00D2FF" />
  </g>

  <!-- Typography Centered -->
  <text x="200" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Smart Study Planner
  </text>
  <text x="200" y="242" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="700" fill="#00D2FF">
    مخطط الدراسة الذكي
  </text>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1">
    ELEVATE YOUR ACADEMIC MASTERY
  </text>
</svg>
