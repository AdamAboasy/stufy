<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ssp-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ssp-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="ssp-hybrid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="ssp-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A1128" stop-opacity="0" />
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="100" cy="95" r="75" fill="url(#ssp-glow)" />

  <!-- ================= Open Book Base ================= -->
  <!-- Left Page Stack Shadow/Depth -->
  <path d="M100 148 C72 135 44 140 22 154 L22 96 C44 82 72 80 100 92 Z" 
        fill="#0F172A" opacity="0.6" />
  <!-- Right Page Stack Shadow/Depth -->
  <path d="M100 148 C128 135 156 140 178 154 L178 96 C156 82 128 80 100 92 Z" 
        fill="#0F172A" opacity="0.6" />

  <!-- Left Main Page -->
  <path d="M100 142 C70 128 42 134 24 146 L24 90 C42 78 70 74 100 86 Z" 
        fill="url(#ssp-blue-grad)" />
  <!-- Left Page Internal Highlights (Book lines) -->
  <path d="M38 102 C55 94 76 92 92 98" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M38 114 C55 106 76 104 92 110" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M38 126 C55 118 76 116 92 122" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Right Main Page -->
  <path d="M100 142 C130 128 158 134 176 146 L176 90 C158 78 130 74 100 86 Z" 
        fill="url(#ssp-purple-grad)" />
  <!-- Right Page Internal Highlights (Book lines) -->
  <path d="M108 98 C124 92 145 94 162 102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M108 110 C124 104 145 106 162 114" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M108 122 C124 116 145 118 162 126" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Book Spine Center Binding -->
  <path d="M100 86 L100 156" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" filter="url(#glow-effect)" />

  <!-- ================= Central Timepiece (Clock) ================= -->
  <!-- Outer Orbit / Aura -->
  <circle cx="100" cy="74" r="46" stroke="url(#ssp-hybrid-grad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Clock Outer Ring -->
  <circle cx="100" cy="74" r="40" fill="#0A1128" stroke="url(#ssp-hybrid-grad)" stroke-width="4.5" filter="url(#glow-effect)" />

  <!-- Inner Dial Background -->
  <circle cx="100" cy="74" r="34" fill="#0F172A" />

  <!-- Hour Marks -->
  <line x1="100" y1="42" x2="100" y2="47" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="132" y1="74" x2="127" y2="74" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="106" x2="100" y2="101" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="68" y1="74" x2="73" y2="74" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />

  <!-- Diagonal Sub-ticks -->
  <circle cx="122.6" cy="51.4" r="1.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="122.6" cy="96.6" r="1.5" fill="#C084FC" opacity="0.8" />
  <circle cx="77.4" cy="96.6" r="1.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="77.4" cy="51.4" r="1.5" fill="#C084FC" opacity="0.8" />

  <!-- Clock Hands (10:10 Golden Progress Position) -->
  <!-- Hour Hand pointing to 10 -->
  <line x1="100" y1="74" x2="84" y2="58" stroke="#00D2FF" stroke-width="3.5" stroke-linecap="round" />
  <!-- Minute Hand pointing to 2 -->
  <line x1="100" y1="74" x2="122" y2="54" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Pin / Radiant Core -->
  <circle cx="100" cy="74" r="5" fill="#00D2FF" filter="url(#glow-effect)" />
  <circle cx="100" cy="74" r="2" fill="#FFFFFF" />

  <!-- Top Intelligence Sparks / Academic Stars -->
  <path d="M100 18 L102 24 L108 26 L102 28 L100 34 L98 28 L92 26 L98 24 Z" fill="#00D2FF" opacity="0.9" filter="url(#glow-effect)" />
  <circle cx="134" cy="30" r="2" fill="#A855F7" opacity="0.75" />
  <circle cx="66" cy="30" r="2" fill="#38BDF8" opacity="0.75" />
</svg>
